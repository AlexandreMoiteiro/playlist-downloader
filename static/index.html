<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101612"><title>Playlist Downloader</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:22px;background:radial-gradient(circle at 50% 15%,#21412d 0%,#0b100d 57%);display:grid;place-items:center;color:#f2fff3;font:16px/1.5 system-ui,sans-serif}main{width:min(100%,520px);text-align:center}.logo{width:66px;height:66px;background:#1ed760;color:#102615;border-radius:20px;font-size:42px;display:grid;place-items:center;margin:0 auto 25px}h1{font-size:clamp(32px,7vw,46px);letter-spacing:-.05em;margin:0 0 10px}p{color:#adbcaf;margin:0 0 29px}form{display:grid;gap:11px}input,button{width:100%;border-radius:12px;padding:16px 18px;font:inherit}input{color:#fff;background:#17271c;border:1px solid #3b5542;outline:0}input:focus{border-color:#1ed760}button{background:#1ed760;color:#092011;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{margin:20px auto 0;min-height:22px;font-size:14px;color:#bdd7c3;overflow-wrap:anywhere}
</style></head><body><main><div class="logo" aria-hidden="true">♫</div><h1>Playlist Downloader</h1><p>Cola o link do Spotify e descarrega a playlist em MP3.</p><form id="form"><input id="url" type="url" aria-label="Link da playlist" placeholder="https://open.spotify.com/playlist/…" required value="https://open.spotify.com/playlist/6G40VBwhgUVwpu4qlC1XaW?si=0001fb8b351a4f6f"><button id="button" type="submit">↓ Descarregar playlist</button></form><div id="status" role="status" aria-live="polite"></div></main>
<script>
const form=document.getElementById('form'),btn=document.getElementById('button'),status=document.getElementById('status');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function api(url,opts){const r=await fetch(url,opts);const v=await r.json();if(!r.ok)throw Error(v.detail||'Erro no pedido');return v}
form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{status.textContent='A iniciar…';const {id}=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});while(true){await sleep(2500);const item=await api('/api/jobs/'+id);status.textContent=item.message;if(item.state==='failed')throw Error(item.message);if(item.state==='ready'){const a=document.createElement('a');a.href='/api/jobs/'+id+'/download';a.download='playlist.zip';document.body.append(a);a.click();a.remove();break;}}}catch(err){status.textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
