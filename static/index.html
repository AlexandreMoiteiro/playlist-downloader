<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b100e"><title>Playlist Downloader</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 8%,#153a26 0%,#0b100e 60%);color:#f1faf2;display:grid;place-items:center;padding:24px}
main{width:min(540px,100%);text-align:center} .mark{height:62px;width:62px;display:grid;place-items:center;background:#1ed760;color:#071f10;border-radius:19px;font-size:40px;font-weight:800;margin:0 auto 27px}
h1{font-weight:850;font-size:clamp(32px,7vw,48px);line-height:1.1;letter-spacing:-.055em;margin:0 0 14px}
p{color:#a6b9ab;font-size:15px;line-height:1.6;margin:0 0 32px}form{display:grid;gap:12px}
input,button{width:100%;padding:16px 18px;border-radius:12px;font-size:16px;font-family:inherit}
input{background:#18281e;border:1px solid #425d49;outline:0;color:#fff;text-overflow:ellipsis}
input:focus{border-color:#1ed760;box-shadow:0 0 0 3px #1ed76024}
button{background:#1ed760;border:0;color:#062513;font-weight:800;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}#status{color:#a6c6b0;font-size:14px;line-height:1.5;min-height:23px;margin:12px 0 0;overflow-wrap:anywhere}
#progress{display:none;margin:20px 0 0}
#progress.visible{display:block}
#track{position:relative;height:10px;background:#26392e;border:1px solid #385645;border-radius:999px;overflow:hidden}
#fill{height:100%;width:35%;border-radius:999px;background:#1ed760;animation:slide 1.7s ease-in-out infinite}
#track.determinate #fill{animation:none;transition:width .35s ease}
#progressText{margin-top:8px;color:#b8d4bf;font-size:13px;text-align:center;min-height:18px}
@keyframes slide{0%{transform:translateX(-105%)}50%{transform:translateX(110%)}100%{transform:translateX(310%)}}
@media(prefers-reduced-motion:reduce){#fill{animation:none;width:100%;opacity:.45}#track.determinate #fill{opacity:1;transition:none}}
</style></head><body><main>
<div class="mark" aria-hidden="true">♫</div>
<h1>Playlist Downloader</h1>
<p>Cola o link da playlist. Nós tratamos do resto.</p>
<form id="form"><input id="playlist" aria-label="Link da playlist do Spotify" type="url" required autocomplete="url" value="https://open.spotify.com/playlist/6G40VBwhgUVwpu4qlC1XaW?si=0001fb8b351a4f6f" placeholder="https://open.spotify.com/playlist/…">
<button id="button" type="submit">↓ Descarregar playlist</button></form>
<div id="progress" aria-label="Progresso do download" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="track"><div id="fill"></div></div><div id="progressText">A iniciar…</div></div><div id="status" role="status" aria-live="polite"></div></main>
<script>
const form=document.querySelector('#form');
const input=document.querySelector('#playlist');
const btn=document.querySelector('#button');
const status=document.querySelector('#status');
const bar=document.querySelector('#progress');
const track=document.querySelector('#track');
const fill=document.querySelector('#fill');
const detail=document.querySelector('#progressText');
function showProgress(x){
  bar.classList.add('visible');
  const determinate=Number.isFinite(x?.percent);
  track.classList.toggle('determinate',determinate);
  if(determinate){
    const pct=Math.max(0,Math.min(100,x.percent));
    fill.style.width=pct+'%';
    bar.setAttribute('aria-valuenow',String(pct));
    detail.textContent=x.state==='ready'?'100% — concluído':pct+'% — a transferir o ZIP';
  }else{
    fill.style.width='';
    bar.removeAttribute('aria-valuenow');
    if(x?.state==='queued')detail.textContent='Em espera na fila…';
    else if(x?.phase==='packaging')detail.textContent='A criar o ZIP…';
    else if(x?.phase==='downloading')detail.textContent=x.downloaded>0?x.downloaded+' MP3 obtidos até agora':'A obter as músicas…';
    else detail.textContent='A processar…';
  }
}
const JOB_KEY='playlist-studio-active-job-v2';
let active=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function report(msg){status.textContent=msg}
async function fetchJSON(url,opts){
  const r=await fetch(url,opts);
  let data;try{data=await r.json()}catch{throw Error('Servidor indisponível.')}
  if(!r.ok)throw Error(data.error||'O pedido falhou.');
  return data;
}
async function monitor(id){
  active=id;btn.disabled=true;
  try{
    while(active===id){
      const x=await fetchJSON('/api/jobs/'+encodeURIComponent(id));
      report(x.message||'A processar…');
      showProgress(x);
      if(x.state==='ready'){
        localStorage.removeItem(JOB_KEY);active=null;
        const a=document.createElement('a');
        a.href='/api/jobs/'+encodeURIComponent(id)+'/download';
        a.download='playlist.zip';document.body.append(a);a.click();a.remove();
        report('A descarregar o ZIP da playlist.');
        showProgress({state:'ready',percent:100});
        break;
      }
      if(x.state==='failed'||x.state==='expired'){
        localStorage.removeItem(JOB_KEY);active=null;
        throw Error(x.message||'Não foi possível concluir o download.');
      }
      await wait(8500);
    }
  }catch(e){
    report(e.message||String(e));
    bar.classList.remove('visible');
    if(active===id){
      // Keep job ID for retry if the connection was interrupted.
      active=null;
    }
  }finally{btn.disabled=false}
}
form.addEventListener('submit',async e=>{
  e.preventDefault();if(btn.disabled)return;
  if(!/^https:\/\/open\.spotify\.com\/playlist\/[A-Za-z0-9]{22}(?:[/?#].*)?$/.test(input.value.trim())){
    report('Introduz um link válido de uma playlist pública do Spotify.');return;
  }
  btn.disabled=true;report('A enviar a playlist…');
  showProgress({state:'queued'});
  try{
    const data=await fetchJSON('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:input.value.trim()})});
    localStorage.setItem(JOB_KEY,data.id);
    monitor(data.id);
  }catch(e){btn.disabled=false;bar.classList.remove('visible');report(e.message||'Não foi possível iniciar o download.')}
});
const saved=localStorage.getItem(JOB_KEY);
if(saved&&/^[0-9a-f]{32}$/.test(saved)){report('A recuperar o download em curso…');monitor(saved);}
</script></body></html>
