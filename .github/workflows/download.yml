name: Process playlist downloads
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: playlist-download-worker
  cancel-in-progress: false
jobs:
  download:
    name: Process queued playlist
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Deno (YouTube extractor)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install spotDL and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "spotdl>=4.4,<5"
      - name: Process next queued job
        run: python scripts/process.py
