name: Process playlist downloads
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: playlist-download-worker
  cancel-in-progress: false
jobs:
  download:
    name: Process queued playlist
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight Cloudflare client
        run: python -m pip install "curl_cffi>=0.15,<1"
      - name: Claim queued playlist
        id: claim
        run: python scripts/claim.py
      - name: Set up Deno (YouTube extractor)
        if: steps.claim.outputs.has_job == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install spotDL and FFmpeg
        if: steps.claim.outputs.has_job == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install "spotdl>=4.4,<5" "yt-dlp"
      - name: Process claimed Spotify playlist
        if: steps.claim.outputs.has_job == 'true' && steps.claim.outputs.kind != 'youtube'
        env:
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          PLAYLIST_URL: ${{ steps.claim.outputs.playlist_url }}
        run: python scripts/process.py
      - name: Process authorized YouTube selection
        if: steps.claim.outputs.has_job == 'true' && steps.claim.outputs.kind == 'youtube'
        env:
          JOB_ID: ${{ steps.claim.outputs.job_id }}
        run: python scripts/youtube_process.py
