name: Process playlist downloads
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: playlist-download-worker
  cancel-in-progress: false
jobs:
  download:
    name: Process queued playlist
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight Cloudflare client
        run: python -m pip install "curl_cffi>=0.15,<1"
      - name: Diagnose YouTube audio availability (metadata only)
        if: github.event_name == 'push'
        run: |
          python -m pip install --quiet "yt-dlp[default]"
          echo "YouTube extractor diagnostics — no audio download:"
          python -m yt_dlp --verbose --list-formats 'https://www.youtube.com/watch?v=bv4IIMtmnyE' > /tmp/ytdlp-check.log 2>&1 || true
          tail -n 65 /tmp/ytdlp-check.log
      - name: Claim queued playlist
        id: claim
        run: python scripts/claim.py
      - name: Set up Deno (YouTube extractor)
        if: steps.claim.outputs.has_job == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install spotDL and FFmpeg
        if: steps.claim.outputs.has_job == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install "spotdl>=4.4,<5"
      - name: Process claimed playlist
        if: steps.claim.outputs.has_job == 'true'
        env:
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          PLAYLIST_URL: ${{ steps.claim.outputs.playlist_url }}
        run: python scripts/process.py
